<!doctype html>
<html lang="sr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      SEO blok. U produkciji server zamenjuje sve izmedju <!==seo==> markera
      sadrzajem specificnim za rutu (vidi server/src/seo.ts), tako da i crawleri
      koji ne izvrsavaju JavaScript (Facebook, Viber, WhatsApp) vide tacne
      podatke. Vrednosti ispod su fallback za dev i za slucaj greske.
    -->
    <!--seo-->
    <title>FK Mladost Lučani — Zvanični sajt kluba</title>
    <meta name="description" content="Zvanični sajt FK Mladost Lučani — Super liga Srbije. Vesti, rezultati, tabela, raspored utakmica i sve o plavo-belima iz Lučana. Tradicija od 1952." />
    <link rel="canonical" href="https://fkmladostlucani.com/" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />

    <meta property="og:title" content="FK Mladost Lučani — Zvanični sajt kluba" />
    <meta property="og:description" content="Vesti, rezultati, tabela i raspored utakmica FK Mladost Lučani. Super liga Srbije — tradicija od 1952. godine." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://fkmladostlucani.com/" />
    <meta property="og:image" content="https://fkmladostlucani.com/og-image.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Stadion FK Mladost Lučani" />
    <meta property="og:locale" content="sr_RS" />
    <meta property="og:site_name" content="FK Mladost Lučani" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="FK Mladost Lučani — Zvanični sajt kluba" />
    <meta name="twitter:description" content="Vesti, rezultati, tabela i raspored utakmica FK Mladost Lučani. Super liga Srbije — tradicija od 1952. godine." />
    <meta name="twitter:image" content="https://fkmladostlucani.com/og-image.jpg" />
    <!--/seo-->

    <!--
      Verifikacija vlasnistva za Google Search Console. Mora da stoji VAN
      <!==seo==> bloka iznad, jer server taj deo zamenjuje po ruti pri svakom
      zahtevu — unutra bi tag nestao i verifikacija bi pukla.
    -->
    <meta
      name="google-site-verification"
      content="UMg192MbBqAfDekLeUKYhMlqAxEHQBWbsLp2eeyaHiA"
    />

    <meta name="author" content="FK Mladost Lučani" />
    <meta name="theme-color" content="#131f33" />
    <link rel="icon" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />

    <!--
      Fonts. Samo tri familije se stvarno koriste u src/index.css i komponentama
      (Montserrat = font-sans, Geist Mono = font-mono, Noto Serif = font-serif) —
      Fira Code, obican Geist, Inter i JetBrains Mono ranije su se ucitavali a
      nigde nisu korisceni. PageSpeed je ovaj <link rel="stylesheet"> flagovao
      kao render-blocking, pa se ucitava asinhrono (preload + swap na "all");
      <noscript> je fallback ako je JS iskljucen.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      crossorigin
      href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@100..900&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Noto+Serif:wght@100..900&display=swap"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@100..900&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Noto+Serif:wght@100..900&display=swap"
      rel="stylesheet"
      crossorigin
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@100..900&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Noto+Serif:wght@100..900&display=swap"
        rel="stylesheet"
      />
    </noscript>

    <!-- Detect dark mode preference and set the class before next-themes loads. This avoids a flash of unstyled content (FOUC) when the page loads. -->
    <script>
      (function () {
        try {
          var theme = localStorage.getItem("theme");
          if (theme === "system" || !theme) {
            var prefersDark = window.matchMedia(
              "(prefers-color-scheme: dark)",
            ).matches;
            theme = prefersDark ? "dark" : "light";
          }
          document.documentElement.classList.add(theme);
        } catch (e) {}
      })();
    </script>

    <link href="/src/index.css" rel="stylesheet" />
  </head>
  <body>
    <!--
      Sadrzaj izmedju markera ispod server ubacuje po ruti (vidi
      server/src/seo/body.ts), tako da crawleri koji ne izvrsavaju JavaScript
      vide pravi tekst umesto praznog <div>. React ga pri hidraciji zameni
      pravom aplikacijom (createRoot ne cita postojeci HTML u #root, samo ga
      obrise), pa obicni posetioci nikad ne vide dupli sadrzaj.
    -->
    <div id="root"><!--ssr--><!--/ssr--></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
